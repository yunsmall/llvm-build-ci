name: Build LLVM

run-name: LLVM ${{ inputs.llvm_ref || 'main' }} (${{ inputs.platforms || 'both' }})${{ github.event_name == 'schedule' && ' · 每日构建' || '' }}

# 手动触发的 LLVM 编译流水线：给定分支 / tag / commit，产出一份解压即用的
# clang + lld 工具链。Windows 用 MSVC 工具链（clang-cl 自举）、Linux 用 gcc
# 编译加 lld 链接。产物形态参考 wasmerio/llvm-custom-builds：Release、strip 过。
on:
  workflow_dispatch:
    inputs:
      llvm_repo:
        description: '源码仓库（填自己的 fork 可带补丁构建，例如 yourname/llvm-project）'
        required: true
        default: 'llvm/llvm-project'
      llvm_ref:
        description: '分支 / tag / 完整 commit SHA（短 SHA 拉不下来）'
        required: true
        default: 'main'
      preset:
        type: choice
        description: '配置档：simple=clang;lld 加 X86（默认）；official=官方包同款（7 个后端 + clang-tools-extra + compiler-rt;openmp）；custom=只按下面三项填'
        options:
          - simple
          - official
          - custom
        default: 'simple'
      targets:
        description: 'LLVM_TARGETS_TO_BUILD，留空=跟随 preset（simple 是 X86）'
        required: false
        default: ''
      projects:
        description: 'LLVM_ENABLE_PROJECTS，留空=跟随 preset（simple 是 clang;lld）'
        required: false
        default: ''
      runtimes:
        description: 'LLVM_ENABLE_RUNTIMES，留空=跟随 preset（Windows 会补 compiler-rt，Linux 不编）；填 none 强制都不编'
        required: false
        default: ''
      platforms:
        type: choice
        description: '编译哪些平台'
        options:
          - both
          - linux
          - windows
        default: 'both'
      compress:
        type: choice
        description: '产物压缩格式：zstd 和官方包一致、压缩率好且多线程；gzip 到处都能解；xz 更小但慢很多；none 不压缩'
        options:
          - zstd
          - gzip
          - xz
          - none
        default: 'zstd'
      create_release:
        type: boolean
        description: '编完发布到本仓库 Release（tag 为 build/<版本>-<sha7>）'
        default: false
  # 每天北京时间 00:17（UTC 16:17）编一次主线。分钟位特意避开 0：整点是
  # GitHub 调度器最挤的刻度，实测踩整点的 cron 整段被跳过（一次都没派发）。
  # 定时触发没有 inputs，下面所有 inputs.* 都写了默认值兜底；
  # 不发布 Release，产物留在 artifact 里
  schedule:
    - cron: '17 16 * * *'

permissions:
  contents: read

# 同一分支上重复点 Run workflow 时取消上一个，避免两个 LLVM 编译抢 4 个核；
# 但不同 llvm_ref 之间必须互不影响，否则并行测多个版本会互相取消
concurrency:
  # 带上 preset 和事件类型：同一 ref 用不同配置档并行跑时不该互相取消，
  # 定时构建也不该被手动构建顶掉
  group: build-llvm-${{ inputs.llvm_ref || 'main' }}-${{ inputs.platforms || 'both' }}-${{ inputs.preset || 'official' }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # 先把 ref 解析成具体提交并读出 LLVM 版本号，后面两个平台用同一份值，
  # 避免两次 clone 之间上游又推进了分支导致两边版本对不上
  prepare:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      sha7: ${{ steps.resolve.outputs.sha7 }}
      version: ${{ steps.resolve.outputs.version }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: 解析 ref 并读取版本号
        id: resolve
        env:
          LLVM_REPO: ${{ inputs.llvm_repo || 'llvm/llvm-project' }}
          LLVM_REF: ${{ inputs.llvm_ref || 'main' }}
        run: |
          set -euo pipefail

          git init -q src
          cd src
          git remote add origin "https://github.com/${LLVM_REPO}.git"

          # --depth 1 只取一个提交。分支名和 tag 名都能直接 fetch；
          # commit SHA 需要服务端允许按 SHA 取（GitHub 对可达提交是允许的）。
          if ! git fetch -q --depth 1 origin "${LLVM_REF}"; then
            echo "直接 fetch '${LLVM_REF}' 失败，回退到按分支名取" >&2
            git fetch -q --depth 1 origin "refs/heads/${LLVM_REF}"
          fi
          git checkout -q --detach FETCH_HEAD

          sha=$(git rev-parse HEAD)
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "sha7=${sha:0:7}" >> "$GITHUB_OUTPUT"

          # 版本号定义在顶层 cmake/Modules/LLVMVersion.cmake，
          # 主分支上是下一个大版本号，tag 上是发布号
          ver_file=cmake/Modules/LLVMVersion.cmake
          major=$(sed -n 's/.*set(LLVM_VERSION_MAJOR \([0-9][0-9]*\)).*/\1/p' "$ver_file" | head -n1)
          minor=$(sed -n 's/.*set(LLVM_VERSION_MINOR \([0-9][0-9]*\)).*/\1/p' "$ver_file" | head -n1)
          patch=$(sed -n 's/.*set(LLVM_VERSION_PATCH \([0-9][0-9]*\)).*/\1/p' "$ver_file" | head -n1)
          if [ -z "$major" ] || [ -z "$minor" ] || [ -z "$patch" ]; then
            echo "无法从 ${ver_file} 解析版本号" >&2
            exit 1
          fi

          echo "version=${major}.${minor}.${patch}" >> "$GITHUB_OUTPUT"
          echo "解析结果: ${major}.${minor}.${patch} @ ${sha}"

      - name: 生成平台矩阵
        id: matrix
        env:
          PLATFORMS: ${{ inputs.platforms || 'both' }}
        run: |
          set -euo pipefail
          case "${PLATFORMS}" in
            both)
              # ubuntu-22.04 是为了让产物跑在更老的 glibc 上；哪天这个镜像退役了
              # 换成 ubuntu-24.04 即可（代价是要求更新的 glibc）
              include='[{"os":"ubuntu-22.04","platform":"linux"},{"os":"windows-2022","platform":"windows"}]'
              ;;
            linux)
              include='[{"os":"ubuntu-22.04","platform":"linux"}]'
              ;;
            windows)
              include='[{"os":"windows-2022","platform":"windows"}]'
              ;;
            *)
              echo "未知的 platforms 取值: ${PLATFORMS}" >&2
              exit 1
              ;;
          esac
          echo "matrix={\"include\":${include}}" >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.platform }})
    needs:
      - prepare
    runs-on: ${{ matrix.os }}
    # 免费 runner 单 job 上限 6 小时，留 10 分钟余量做收尾和上传
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: 拉取源码
        shell: bash
        env:
          LLVM_REPO: ${{ inputs.llvm_repo || 'llvm/llvm-project' }}
          LLVM_REF: ${{ inputs.llvm_ref || 'main' }}
          EXPECTED_SHA: ${{ needs.prepare.outputs.sha }}
        run: bash scripts/fetch-source.sh

      - name: 清理磁盘（Linux）
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # 22.04 镜像默认只剩十几 G，删掉预装的大块 SDK 才能塞下 build + stage
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/.ghcup \
            /usr/share/swift
          df -h /

      - name: 查看磁盘（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-PSDrive -PSProvider FileSystem |
            Select-Object Name, @{n = 'FreeGB'; e = { [math]::Round($_.Free / 1GB, 1) } }, @{n = 'UsedGB'; e = { [math]::Round($_.Used / 1GB, 1) } }

      - name: 安装构建依赖（Linux）
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build lld zstd xz-utils
          # 22.04 自带 cmake 3.22，刚好过 LLVM 23 的 3.20 下限但会告警，
          # 装个新的免得以后 LLVM 24 直接报错
          python3 -m pip install --user -q "cmake>=3.31,<4"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          # 当前 step 的 PATH 还没变，直接指到新装的那个
          "$HOME/.local/bin/cmake" --version | head -n1
          ninja --version

      - name: 初始化 MSVC 环境（Windows）
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: x64

      - name: 确认 zstd 可用（Windows）
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          command -v zstd || choco install zstandard -y --no-progress
          zstd --version
          cmake --version | head -n1
          ninja --version

      - name: 计算产物目录名
        id: dist
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          case "${RUNNER_OS}" in
            Windows) name="clang+llvm-${VERSION}-x86_64-pc-windows-msvc" ;;
            Linux) name="LLVM-${VERSION}-Linux-X64" ;;
            *) echo "未支持的系统: ${RUNNER_OS}" >&2; exit 1 ;;
          esac
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "产物目录: ${name}"

      # 官方包是自带源码编 zlib/zstd/libxml2 再静态链进去的。Linux 的 -dev 包
      # 不一定带静态库（带了也是发行版版本、链进去就无法跨发行版用），Windows
      # 干脆没有，所以两个平台都照官方版本现编，版本号和校验和与他一致
      - name: 准备第三方库（official 档）
        if: (inputs.preset || 'official') == 'official'
        shell: bash
        env:
          ZLIB_VERSION: '1.3.2'
          ZSTD_VERSION: '1.5.7'
          LIBXML2_VERSION: '2.9.12'
        run: bash scripts/prepare-deps.sh

      - name: 配置
        shell: bash
        env:
          DIST_NAME: ${{ steps.dist.outputs.name }}
          # 定时构建没有 inputs，兜底走 official（和官方包同款）；手动触发时
          # inputs.preset 有值（默认 simple），不受影响
          PRESET: ${{ inputs.preset || 'official' }}
          TARGETS: ${{ inputs.targets }}
          PROJECTS: ${{ inputs.projects }}
          RUNTIMES: ${{ inputs.runtimes }}
        run: bash scripts/configure.sh

      - name: 编译并安装
        shell: bash
        run: bash scripts/build-install.sh

      - name: 打包
        shell: bash
        env:
          DIST_NAME: ${{ steps.dist.outputs.name }}
          COMPRESS: ${{ inputs.compress || 'zstd' }}
        run: bash scripts/package.sh

      - name: 上传 artifact
        uses: actions/upload-artifact@v7
        with:
          name: llvm-${{ matrix.platform }}-${{ needs.prepare.outputs.sha7 }}
          path: |
            stage/*.tar
            stage/*.tar.*
            stage/*.sha256
            stage/*-cmake.md
          # 内容已经压过了，再压一遍只是白烧 CPU
          compression-level: 0
          retention-days: 14

  release:
    name: 发布到 Release
    needs:
      - prepare
      - build
    # boolean 输入在 github.event.inputs 里恒为字符串，用字符串比较最稳
    if: github.event.inputs.create_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载产物
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: 把各平台的配置命令拼进 notes
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          SHA7: ${{ needs.prepare.outputs.sha7 }}
          REF: ${{ inputs.llvm_ref || 'main' }}
          REPO: ${{ inputs.llvm_repo || 'llvm/llvm-project' }}
          PRESET: ${{ inputs.preset || 'official' }}
          COMPRESS: ${{ inputs.compress || 'zstd' }}
        run: |
          set -euo pipefail

          {
            printf 'LLVM %s，源码 %s@%s（%s）。\n\n' "$VERSION" "$REPO" "$REF" "$SHA7"
            printf -- '- preset: %s\n' "$PRESET"
            printf -- '- 压缩: %s\n' "$COMPRESS"
            # 分隔符必须加引号：正文里带反引号，未加引号的 heredoc 会把它们当命令替换执行，
            # 结果是这段文字被吞掉、cat 仍然成功，坏掉的 notes 照样发出去（已发生过）
            cat <<'EOF'
          - 由 GitHub Actions 在 runner 上现编，非官方发布

          ## 配置命令

          下面是编出各平台产物的 cmake 配置命令原文，由构建过程自己记录。
          命令里的 `<workspace>` 指构建时的工作目录，换成你自己的路径即可（`llvm-project/`
          和 `thirdparty/` 都在它下面）。
          EOF
          } > notes.md

          for f in dist/*-cmake.md; do
            [ -e "$f" ] || continue
            # 文件名形如 LLVM-23.1.4-Linux-X64-cmake.md
            name=$(basename "$f" -cmake.md)
            printf '\n### %s\n\n' "$name" >> notes.md
            cat "$f" >> notes.md
          done

      - name: 创建并上传 Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SHA7: ${{ needs.prepare.outputs.sha7 }}
        run: |
          set -euo pipefail

          tag="build/${VERSION}-${SHA7}"

          # 重跑同一个提交时 release 已经存在，create 会报错，先查再建
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release ${tag} 已存在，更新 notes 并覆盖上传"
            gh release edit "$tag" --notes-file notes.md
          else
            gh release create "$tag" \
              --title "LLVM ${VERSION} (${SHA7})" \
              --notes-file notes.md \
              --prerelease
          fi
          # *-cmake.md 只是生成 notes 的原料，不往 Release 上挂
          find dist -maxdepth 1 -type f ! -name '*-cmake.md' -print0 |
            xargs -0 gh release upload "$tag" --clobber
