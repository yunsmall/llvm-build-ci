name: Build LLVM

run-name: LLVM ${{ inputs.llvm_ref }} (${{ inputs.platforms }})

# 手动触发的 LLVM 编译流水线：给定分支 / tag / commit，产出一份解压即用的
# clang + lld 工具链。Windows 用 MSVC 工具链（clang-cl 自举）、Linux 用 gcc
# 编译加 lld 链接。产物形态参考 wasmerio/llvm-custom-builds：Release、strip 过。
on:
  workflow_dispatch:
    inputs:
      llvm_repo:
        description: '源码仓库（填自己的 fork 可带补丁构建，例如 yourname/llvm-project）'
        required: true
        default: 'llvm/llvm-project'
      llvm_ref:
        description: '分支 / tag / 完整 commit SHA（短 SHA 拉不下来）'
        required: true
        default: 'main'
      preset:
        type: choice
        description: '配置档：simple=clang;lld 加 X86（默认）；official=官方包同款（7 个后端 + clang-tools-extra + compiler-rt;openmp）；custom=只按下面三项填'
        options:
          - simple
          - official
          - custom
        default: 'simple'
      targets:
        description: 'LLVM_TARGETS_TO_BUILD，留空=跟随 preset（simple 是 X86）'
        required: false
        default: ''
      projects:
        description: 'LLVM_ENABLE_PROJECTS，留空=跟随 preset（simple 是 clang;lld）'
        required: false
        default: ''
      runtimes:
        description: 'LLVM_ENABLE_RUNTIMES，留空=跟随 preset（Windows 会补 compiler-rt，Linux 不编）；填 none 强制都不编'
        required: false
        default: ''
      platforms:
        type: choice
        description: '编译哪些平台'
        options:
          - both
          - linux
          - windows
        default: 'both'
      compress:
        type: choice
        description: '产物压缩格式：zstd 和官方包一致、压缩率好且多线程；gzip 到处都能解；xz 更小但慢很多；none 不压缩'
        options:
          - zstd
          - gzip
          - xz
          - none
        default: 'zstd'
      create_release:
        type: boolean
        description: '编完发布到本仓库 Release（tag 为 build/<版本>-<sha7>）'
        default: false

permissions:
  contents: read

# 同一分支上重复点 Run workflow 时取消上一个，避免两个 LLVM 编译抢 4 个核；
# 但不同 llvm_ref 之间必须互不影响，否则并行测多个版本会互相取消
concurrency:
  # 带上 preset：同一 ref 用不同配置档并行跑时不该互相取消
  group: build-llvm-${{ inputs.llvm_ref }}-${{ inputs.platforms }}-${{ inputs.preset }}
  cancel-in-progress: true

env:
  # 关掉可选依赖，产物不绑定 runner 上碰巧装了的库；UTILS 关掉能省掉
  # FileCheck 等测试工具（前提是 TESTS 也关，LLVM 的 CMake 有这个断言）
  # zlib/zstd/libxml2 由 preset 决定，不在这里写死
  HERMETIC_CMAKE_FLAGS: >-
    -DLLVM_ENABLE_CURL=OFF
    -DLLVM_ENABLE_LIBEDIT=OFF
    -DLLVM_ENABLE_FFI=OFF
    -DLLVM_ENABLE_BINDINGS=OFF
    -DLLVM_ENABLE_TERMINFO=OFF
    -DLLVM_INCLUDE_TESTS=OFF
    -DLLVM_INCLUDE_DOCS=OFF
    -DLLVM_INCLUDE_EXAMPLES=OFF
    -DLLVM_INCLUDE_BENCHMARKS=OFF
    -DLLVM_INCLUDE_UTILS=OFF
    -DLLVM_INCLUDE_GO_TESTS=OFF
    -DLLVM_OPTIMIZED_TABLEGEN=ON
    -DLLVM_ENABLE_ASSERTIONS=OFF

jobs:
  # 先把 ref 解析成具体提交并读出 LLVM 版本号，后面两个平台用同一份值，
  # 避免两次 clone 之间上游又推进了分支导致两边版本对不上
  prepare:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      sha7: ${{ steps.resolve.outputs.sha7 }}
      version: ${{ steps.resolve.outputs.version }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: 解析 ref 并读取版本号
        id: resolve
        env:
          LLVM_REPO: ${{ inputs.llvm_repo }}
          LLVM_REF: ${{ inputs.llvm_ref }}
        run: |
          set -euo pipefail

          git init -q src
          cd src
          git remote add origin "https://github.com/${LLVM_REPO}.git"

          # --depth 1 只取一个提交。分支名和 tag 名都能直接 fetch；
          # commit SHA 需要服务端允许按 SHA 取（GitHub 对可达提交是允许的）。
          if ! git fetch -q --depth 1 origin "${LLVM_REF}"; then
            echo "直接 fetch '${LLVM_REF}' 失败，回退到按分支名取" >&2
            git fetch -q --depth 1 origin "refs/heads/${LLVM_REF}"
          fi
          git checkout -q --detach FETCH_HEAD

          sha=$(git rev-parse HEAD)
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "sha7=${sha:0:7}" >> "$GITHUB_OUTPUT"

          # 版本号定义在顶层 cmake/Modules/LLVMVersion.cmake，
          # 主分支上是下一个大版本号，tag 上是发布号
          ver_file=cmake/Modules/LLVMVersion.cmake
          major=$(sed -n 's/.*set(LLVM_VERSION_MAJOR \([0-9][0-9]*\)).*/\1/p' "$ver_file" | head -n1)
          minor=$(sed -n 's/.*set(LLVM_VERSION_MINOR \([0-9][0-9]*\)).*/\1/p' "$ver_file" | head -n1)
          patch=$(sed -n 's/.*set(LLVM_VERSION_PATCH \([0-9][0-9]*\)).*/\1/p' "$ver_file" | head -n1)
          if [ -z "$major" ] || [ -z "$minor" ] || [ -z "$patch" ]; then
            echo "无法从 ${ver_file} 解析版本号" >&2
            exit 1
          fi

          echo "version=${major}.${minor}.${patch}" >> "$GITHUB_OUTPUT"
          echo "解析结果: ${major}.${minor}.${patch} @ ${sha}"

      - name: 生成平台矩阵
        id: matrix
        env:
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          set -euo pipefail
          case "${PLATFORMS}" in
            both)
              # ubuntu-22.04 是为了让产物跑在更老的 glibc 上；哪天这个镜像退役了
              # 换成 ubuntu-24.04 即可（代价是要求更新的 glibc）
              include='[{"os":"ubuntu-22.04","platform":"linux"},{"os":"windows-2022","platform":"windows"}]'
              ;;
            linux)
              include='[{"os":"ubuntu-22.04","platform":"linux"}]'
              ;;
            windows)
              include='[{"os":"windows-2022","platform":"windows"}]'
              ;;
            *)
              echo "未知的 platforms 取值: ${PLATFORMS}" >&2
              exit 1
              ;;
          esac
          echo "matrix={\"include\":${include}}" >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.platform }})
    needs:
      - prepare
    runs-on: ${{ matrix.os }}
    # 免费 runner 单 job 上限 6 小时，留 10 分钟余量做收尾和上传
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: 拉取源码
        shell: bash
        env:
          LLVM_REPO: ${{ inputs.llvm_repo }}
          LLVM_REF: ${{ inputs.llvm_ref }}
          EXPECTED_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail

          git init -q llvm-project
          cd llvm-project
          git remote add origin "https://github.com/${LLVM_REPO}.git"
          if ! git fetch -q --depth 1 origin "${LLVM_REF}"; then
            git fetch -q --depth 1 origin "refs/heads/${LLVM_REF}"
          fi
          git checkout -q --detach FETCH_HEAD

          # ref 是分支时，prepare 和 build 之间可能又推进了，编译前确认拿到的
          # 还是同一个提交，否则产物和你以为的版本不一致
          actual=$(git rev-parse HEAD)
          if [ "${actual}" != "${EXPECTED_SHA}" ]; then
            echo "提交不一致：期望 ${EXPECTED_SHA}，实际 ${actual}" >&2
            exit 1
          fi
          echo "sources: ${actual}"

      - name: 清理磁盘（Linux）
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # 22.04 镜像默认只剩十几 G，删掉预装的大块 SDK 才能塞下 build + stage
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/.ghcup \
            /usr/share/swift
          df -h /

      - name: 查看磁盘（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-PSDrive -PSProvider FileSystem |
            Select-Object Name, @{n = 'FreeGB'; e = { [math]::Round($_.Free / 1GB, 1) } }, @{n = 'UsedGB'; e = { [math]::Round($_.Used / 1GB, 1) } }

      - name: 安装构建依赖（Linux）
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build lld zstd xz-utils
          # 22.04 自带 cmake 3.22，刚好过 LLVM 23 的 3.20 下限但会告警，
          # 装个新的免得以后 LLVM 24 直接报错
          python3 -m pip install --user -q "cmake>=3.31,<4"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          # 当前 step 的 PATH 还没变，直接指到新装的那个
          "$HOME/.local/bin/cmake" --version | head -n1
          ninja --version

      - name: 初始化 MSVC 环境（Windows）
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: 确认 zstd 可用（Windows）
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          command -v zstd || choco install zstandard -y --no-progress
          zstd --version
          cmake --version | head -n1
          ninja --version

      - name: 计算产物目录名
        id: dist
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          case "${RUNNER_OS}" in
            Windows) name="clang+llvm-${VERSION}-x86_64-pc-windows-msvc" ;;
            Linux) name="LLVM-${VERSION}-Linux-X64" ;;
            *) echo "未支持的系统: ${RUNNER_OS}" >&2; exit 1 ;;
          esac
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "产物目录: ${name}"

      # 官方包是自带源码编 zlib/zstd/libxml2 再静态链进去的。Linux 的 -dev 包
      # 不一定带静态库（带了也是发行版版本、链进去就无法跨发行版用），Windows
      # 干脆没有，所以两个平台都照官方版本现编，版本号和校验和与他一致
      - name: 准备第三方库（official 档）
        if: inputs.preset == 'official'
        shell: bash
        env:
          ZLIB_VERSION: '1.3.2'
          ZSTD_VERSION: '1.5.7'
          LIBXML2_VERSION: '2.9.12'
        run: |
          set -euo pipefail

          prefix="${GITHUB_WORKSPACE}/thirdparty"
          work="${RUNNER_TEMP}/deps"
          mkdir -p "$prefix" "$work"
          cd "$work"

          fetch() {
            curl -fsSL -o "$3" "$1"
            echo "$2  $3" | sha256sum -c -
          }

          build() {
            local src="$1" bdir="$2" idir="$3"
            shift 3
            cmake -S "$src" -B "$bdir" -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX="$idir" "$@"
            ninja -C "$bdir" install
          }

          fetch "https://github.com/madler/zlib/releases/download/v${ZLIB_VERSION}/zlib-${ZLIB_VERSION}.tar.gz" \
            bb329a0a2cd0274d05519d61c667c062e06990d72e125ee2dfa8de64f0119d16 zlib.tgz
          tar xf zlib.tgz
          build "zlib-${ZLIB_VERSION}" bzlib "$prefix/zlib" \
            -DZLIB_BUILD_TESTING=OFF -DZLIB_BUILD_SHARED=OFF \
            -DZLIB_BUILD_STATIC=ON -DZLIB_INSTALL=ON

          # zstd/libxml2 的包里带测试目录，里面有符号链接，Windows 上解不出来
          fetch "https://github.com/facebook/zstd/releases/download/v${ZSTD_VERSION}/zstd-${ZSTD_VERSION}.tar.gz" \
            eb33e51f49a15e023950cd7825ca74a4a2b43db8354825ac24fc1b7ee09e6fa3 zstd.tgz
          tar xf zstd.tgz --exclude 'tests/*'
          build "zstd-${ZSTD_VERSION}/build/cmake" bzstd "$prefix/zstd" \
            -DZSTD_BUILD_PROGRAMS=OFF -DZSTD_BUILD_TESTS=OFF \
            -DZSTD_BUILD_STATIC=ON -DZSTD_BUILD_SHARED=OFF

          fetch "https://gitlab.gnome.org/GNOME/libxml2/-/archive/v${LIBXML2_VERSION}/libxml2-v${LIBXML2_VERSION}.tar.gz" \
            98bfa7a9a5e2a75638422050740448ee9f02bf4dc2075c9822d7747d5ff9e617 libxml2.tgz
          tar xf libxml2.tgz --exclude 'test/*'
          build "libxml2-v${LIBXML2_VERSION}" bxml "$prefix/libxml2" \
            -DBUILD_SHARED_LIBS=OFF -DLIBXML2_WITH_C14N=OFF -DLIBXML2_WITH_CATALOG=OFF \
            -DLIBXML2_WITH_DEBUG=OFF -DLIBXML2_WITH_DOCB=OFF -DLIBXML2_WITH_FTP=OFF \
            -DLIBXML2_WITH_HTML=OFF -DLIBXML2_WITH_HTTP=OFF -DLIBXML2_WITH_ICONV=OFF \
            -DLIBXML2_WITH_ICU=OFF -DLIBXML2_WITH_ISO8859X=OFF -DLIBXML2_WITH_LEGACY=OFF \
            -DLIBXML2_WITH_LZMA=OFF -DLIBXML2_WITH_MEM_DEBUG=OFF -DLIBXML2_WITH_MODULES=OFF \
            -DLIBXML2_WITH_OUTPUT=ON -DLIBXML2_WITH_PATTERN=OFF -DLIBXML2_WITH_PROGRAMS=OFF \
            -DLIBXML2_WITH_PUSH=OFF -DLIBXML2_WITH_PYTHON=OFF -DLIBXML2_WITH_READER=OFF \
            -DLIBXML2_WITH_REGEXPS=OFF -DLIBXML2_WITH_RUN_DEBUG=OFF -DLIBXML2_WITH_SAX1=ON \
            -DLIBXML2_WITH_SCHEMAS=OFF -DLIBXML2_WITH_SCHEMATRON=OFF -DLIBXML2_WITH_TESTS=OFF \
            -DLIBXML2_WITH_THREADS=ON -DLIBXML2_WITH_THREAD_ALLOC=OFF -DLIBXML2_WITH_TREE=ON \
            -DLIBXML2_WITH_VALID=OFF -DLIBXML2_WITH_WRITER=OFF -DLIBXML2_WITH_XINCLUDE=OFF \
            -DLIBXML2_WITH_XPATH=OFF -DLIBXML2_WITH_XPTR=OFF -DLIBXML2_WITH_ZLIB=OFF

          # 静态库文件名各平台/各版本不一样，编完直接找出来，别猜
          pick() {
            local dir="$1" name
            shift
            for name in "$@"; do
              if [ -e "${dir}/${name}" ]; then
                echo "${dir}/${name}"
                return 0
              fi
            done
            echo "找不到 $* —— 目录 ${dir} 内容：" >&2
            ls -l "${dir}" >&2
            return 1
          }

          zlib_lib=$(pick "$prefix/zlib/lib" zs.lib libzs.a libz.a)
          zstd_lib=$(pick "$prefix/zstd/lib" zstd_static.lib libzstd.a)
          xml_lib=$(pick "$prefix/libxml2/lib" libxml2s.lib libxml2.a)

          {
            echo "DEP_ZLIB_INCLUDE=${prefix}/zlib/include"
            echo "DEP_ZLIB_LIBRARY=${zlib_lib}"
            echo "DEP_ZSTD_INCLUDE=${prefix}/zstd/include"
            echo "DEP_ZSTD_LIBRARY=${zstd_lib}"
            echo "DEP_LIBXML2_INCLUDE=${prefix}/libxml2/include/libxml2"
            echo "DEP_LIBXML2_LIBRARY=${xml_lib}"
          } >> "$GITHUB_ENV"
          echo "第三方库: zlib=${zlib_lib} zstd=${zstd_lib} libxml2=${xml_lib}"

      - name: 配置
        shell: bash
        env:
          DIST_NAME: ${{ steps.dist.outputs.name }}
          PRESET: ${{ inputs.preset }}
          TARGETS: ${{ inputs.targets }}
          PROJECTS: ${{ inputs.projects }}
          RUNTIMES: ${{ inputs.runtimes }}
        run: |
          set -euo pipefail

          # 预设只负责给下面三项填默认值：输入框留空就跟随预设，填了就以你填的为准，
          # 所以既能一键用官方配置，也能只改其中一项
          case "${PRESET}" in
            official)
              def_targets="AArch64;ARM;X86;BPF;WebAssembly;RISCV;NVPTX"
              def_projects="clang;clang-tools-extra;lld"
              def_runtimes="compiler-rt;openmp"
              ;;
            *)
              def_targets="X86"
              def_projects="clang;lld"
              def_runtimes=""
              ;;
          esac

          targets="${TARGETS:-$def_targets}"
          projects="${PROJECTS:-$def_projects}"
          runtimes="${RUNTIMES:-$def_runtimes}"
          # none/off 用来显式关掉 Windows 上自动补的 compiler-rt
          case "${runtimes}" in
            none | off | None | Off) runtimes="" ;;
          esac

          has_runtime() {
            case ";$1;" in
              *";$2;"*) return 0 ;;
              *) return 1 ;;
            esac
          }

          # 从分号列表里去掉一项，用于把当前平台编不了的 runtime 降级掉
          drop_runtime() {
            local item keep=''
            local IFS=';'
            for item in $1; do
              [ "$item" = "$2" ] || keep="${keep:+$keep;}$item"
            done
            printf '%s' "$keep"
          }

          extra=()
          if [ "${RUNNER_OS}" = "Linux" ]; then
            # 用 lld 链接，比 GNU ld 快很多，LLVM 这种巨型项目差别明显
            extra+=("-DLLVM_USE_LINKER=lld")
            if has_runtime "${runtimes}" compiler-rt; then
              # compiler-rt 的 sanitizer 运行时只能用 clang 编，gcc 会直接报错
              if command -v clang >/dev/null 2>&1 && command -v clang++ >/dev/null 2>&1; then
                extra+=("-DCMAKE_C_COMPILER=clang" "-DCMAKE_CXX_COMPILER=clang++")
              else
                echo "::warning::runner 上没有 clang，去掉 compiler-rt"
                runtimes=$(drop_runtime "${runtimes}" compiler-rt)
              fi
            fi
            # 没编 compiler-rt 就明确走 libgcc：否则 clang 会去 resource dir 里
            # 找不存在的 clang_rt.builtins，个别代码（__int128 除法之类）链接失败
            if ! has_runtime "${runtimes}" compiler-rt; then
              extra+=("-DCLANG_DEFAULT_RTLIB=libgcc")
            fi
          elif [ "${RUNNER_OS}" = "Windows" ]; then
            # cl.exe 编不了 compiler-rt，而 Windows 版 clang 的产物里带
            # /DEFAULTLIB:clang_rt.builtins，缺了它有些代码链不上。
            # runner 镜像自带 LLVM，用它自举：快，且能编 compiler-rt。
            if command -v clang-cl >/dev/null 2>&1 && command -v lld-link >/dev/null 2>&1; then
              extra+=(
                "-DCMAKE_C_COMPILER=clang-cl"
                "-DCMAKE_CXX_COMPILER=clang-cl"
                "-DCMAKE_LINKER=lld-link"
                "-DLLVM_ENABLE_LLD=ON"
              )
              [ -n "${runtimes}" ] || runtimes="compiler-rt"
            else
              echo "::warning::找不到 clang-cl/lld-link，退回 cl.exe，且不编 compiler-rt"
              runtimes=""
            fi
          fi

          if [ -n "${runtimes}" ]; then
            extra+=("-DLLVM_ENABLE_RUNTIMES=${runtimes}")
            # 官方也关：ORC 的运行时这里用不上，编起来还费时间
            if has_runtime "${runtimes}" compiler-rt; then
              extra+=("-DCOMPILER_RT_BUILD_ORC=OFF")
            fi
          fi

          # official 档链上一步现编的三个库（路径由那一步写进环境变量），
          # 其余档一律关掉，保证产物不依赖 runner 上碰巧存在的库
          if [ -n "${DEP_ZLIB_LIBRARY:-}" ]; then
            extra+=(
              "-DLLVM_ENABLE_ZLIB=FORCE_ON"
              "-DLLVM_ENABLE_ZSTD=FORCE_ON"
              "-DLLVM_ENABLE_LIBXML2=FORCE_ON"
              "-DCLANG_ENABLE_LIBXML2=OFF"
              "-DZLIB_INCLUDE_DIR=${DEP_ZLIB_INCLUDE}"
              "-DZLIB_LIBRARY=${DEP_ZLIB_LIBRARY}"
              "-DZLIB_LIBRARY_RELEASE=${DEP_ZLIB_LIBRARY}"
              "-Dzstd_INCLUDE_DIR=${DEP_ZSTD_INCLUDE}"
              "-Dzstd_LIBRARY=${DEP_ZSTD_LIBRARY}"
              "-DLIBXML2_INCLUDE_DIR=${DEP_LIBXML2_INCLUDE}"
              "-DLIBXML2_LIBRARIES=${DEP_LIBXML2_LIBRARY}"
            )
            # 静态 libxml2 的头部默认按 dllimport 声明，Windows 上必须显式说静态
            if [ "${RUNNER_OS}" = "Windows" ]; then
              extra+=("-DCMAKE_C_FLAGS=-DLIBXML_STATIC" "-DCMAKE_CXX_FLAGS=-DLIBXML_STATIC")
            fi
            third_party="zlib+zstd+libxml2"
          else
            extra+=(
              "-DLLVM_ENABLE_ZLIB=OFF"
              "-DLLVM_ENABLE_ZSTD=OFF"
              "-DLLVM_ENABLE_LIBXML2=OFF"
            )
            third_party="off"
          fi

          echo "preset=${PRESET} targets=${targets} projects=${projects} runtimes=${runtimes:-<none>} third_party=${third_party}"

          cmake -S llvm-project/llvm -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${GITHUB_WORKSPACE}/stage/${DIST_NAME}" \
            -DLLVM_ENABLE_PROJECTS="${projects}" \
            -DLLVM_TARGETS_TO_BUILD="${targets}" \
            ${HERMETIC_CMAKE_FLAGS} \
            "${extra[@]}"

      - name: 编译并安装
        shell: bash
        run: |
          set -euo pipefail
          ninja -C build
          # 只装不编译，装的时候顺手 strip：不 strip 的话 Linux 包会大出好几百 MB
          # （Windows 上没有 strip，CMake 会当成空操作，所以分开写避免踩坑）
          if [ "${RUNNER_OS}" = "Linux" ]; then
            cmake --install build --strip
          else
            cmake --install build
          fi

      - name: 打包
        shell: bash
        env:
          DIST_NAME: ${{ steps.dist.outputs.name }}
          COMPRESS: ${{ inputs.compress }}
        run: |
          set -euo pipefail

          case "${COMPRESS}" in
            zstd) ext="tar.zst" ;;
            gzip) ext="tar.gz" ;;
            xz) ext="tar.xz" ;;
            none) ext="tar" ;;
            *) echo "未知的压缩格式: ${COMPRESS}" >&2; exit 1 ;;
          esac
          out="${DIST_NAME}.${ext}"

          tar_extra=()
          # Windows 上解包时符号链接建不出来（目标可能还没被解出来），
          # 打包时展开成真实文件最省事
          if [ "${RUNNER_OS}" = "Windows" ]; then
            tar_extra+=("--dereference")
          fi

          cd stage
          # --long=27 是 128 MB 窗口，正好是 zstd 默认解压上限：压缩率明显好于
          # 8 MB 默认窗口，又不至于让用户解压时非带 --long 参数不可
          case "${COMPRESS}" in
            zstd) tar "${tar_extra[@]}" -cf - "${DIST_NAME}" | zstd -19 --long=27 -T0 -q -o "${out}" ;;
            gzip) tar "${tar_extra[@]}" -cf - "${DIST_NAME}" | gzip -9 > "${out}" ;;
            xz) tar "${tar_extra[@]}" -cf - "${DIST_NAME}" | xz -9 -T0 -c > "${out}" ;;
            none) tar "${tar_extra[@]}" -cf "${out}" "${DIST_NAME}" ;;
          esac
          # Windows 的 Git Bash 有可能把行尾写成 CRLF，去掉免得 Linux 上 -c 校验失败
          sha256sum "${out}" | tr -d '\r' > "${out}.sha256"
          ls -lh

      - name: 上传 artifact
        uses: actions/upload-artifact@v4
        with:
          name: llvm-${{ matrix.platform }}-${{ needs.prepare.outputs.sha7 }}
          path: |
            stage/*.tar
            stage/*.tar.*
            stage/*.sha256
          # 内容已经压过了，再压一遍只是白烧 CPU
          compression-level: 0
          retention-days: 14

  release:
    name: 发布到 Release
    needs:
      - prepare
      - build
    # boolean 输入在 github.event.inputs 里恒为字符串，用字符串比较最稳
    if: github.event.inputs.create_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载产物
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 创建并上传 Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SHA7: ${{ needs.prepare.outputs.sha7 }}
          REF: ${{ inputs.llvm_ref }}
          REPO: ${{ inputs.llvm_repo }}
          PRESET: ${{ inputs.preset }}
          TARGETS: ${{ inputs.targets }}
          PROJECTS: ${{ inputs.projects }}
          RUNTIMES: ${{ inputs.runtimes }}
          COMPRESS: ${{ inputs.compress }}
        run: |
          set -euo pipefail

          tag="build/${VERSION}-${SHA7}"
          # 输入框留空时用占位符，实际生效值在 build 日志的 "preset=..." 行里
          cat > notes.md <<EOF
          LLVM ${VERSION}，源码 ${REPO}@${REF}（${SHA7}）。

          - preset: ${PRESET}
          - targets: ${TARGETS:-（跟随 preset）}
          - projects: ${PROJECTS:-（跟随 preset）}
          - runtimes: ${RUNTIMES:-（跟随 preset）}
          - 压缩: ${COMPRESS}
          - 由 GitHub Actions 在 runner 上现编，非官方发布
          EOF

          # 重跑同一个提交时 release 已经存在，create 会报错，先查再建
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release ${tag} 已存在，直接覆盖上传"
          else
            gh release create "$tag" \
              --title "LLVM ${VERSION} (${SHA7})" \
              --notes-file notes.md \
              --prerelease
          fi
          gh release upload "$tag" dist/* --clobber
